  - >-
    读完这 13 篇文章，我读到一条反复折返的线索：你想走向更大的世界，也在寻找值得自己认可的生活标准。《寻找真正的自己》提醒你不必同时满足所有人的要求，《一个优秀的大学生？》又列出了熟悉的评价清单。这两种声音放在一起，让博客留下了思考尚未定型时的样子，也留下一个值得继续追问的问题：哪些目标是你愿意承担代价去实现的？
